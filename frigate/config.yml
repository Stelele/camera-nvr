# Frigate config for the Yoosee C173 dual-lens camera, local recording only.
#
# Stream facts, measured from the camera (not guessed):
#   /onvif1  HEVC 1920x2160 @25fps + PCMA 16kHz mono   ~943 kbps (128 of it audio)
#   /onvif2  HEVC 864x976  @25fps                     ~214 kbps
#
# 1920x2160 is TWO independent 1080p sensors stacked vertically, NOT a seamless
# stitch. Each half carries its own clock and points ~90 degrees from the other,
# so the frame contains two unrelated scenes. Crop to one 1920x1080 half before
# any analysis. Only /onvif1 and /onvif2 exist; everything else returns 400.

mqtt:
  enabled: false

ffmpeg:
  # Intel integrated graphics. Requires /dev/dri passed through (see compose).
  # If decode fails on the laptop, try `preset-qsv`, or delete this line for
  # software decode (slower, but always works).
  hwaccel_args: preset-vaapi

detectors:
  cpu:
    type: cpu

record:
  enabled: true
  # Retention, in days, comes from FRIGATE_RETAIN_DAYS. Local disk is the only
  # store, so this is the whole retention policy — size it to the disk.
  #
  # Recording is continuous: broilers move constantly, so motion gating rejects
  # almost nothing while making the resulting archive harder to reason about.
  # See docs/FINDINGS.md 5 for the measured per-day volumes behind this choice.
  continuous:
    days: "{FRIGATE_RETAIN_DAYS}"
  motion:
    days: "{FRIGATE_RETAIN_DAYS}"
  alerts:
    retain:
      days: "{FRIGATE_RETAIN_DAYS}"
  detections:
    retain:
      days: "{FRIGATE_RETAIN_DAYS}"

# In this Frigate version `snapshots` is a top-level section, not under `record`.
snapshots:
  enabled: true
  retain:
    default: "{FRIGATE_SNAPSHOT_DAYS}"

go2rtc:
  streams:
    cam_main: "{FRIGATE_CAM_MAIN_URL}"
    cam_sub: "{FRIGATE_CAM_SUB_URL}"

cameras:
  cam_house:
    ffmpeg:
      inputs:
        # Detect on the low-res stream. Running detection on 1920x2160 would
        # cost ~10x the CPU for no accuracy gain on a fixed scene.
        - path: rtsp://127.0.0.1:8554/cam_sub
          roles:
            - detect
        # Record the full-resolution main stream, with its audio channel.
        - path: rtsp://127.0.0.1:8554/cam_main
          roles:
            - record
            - audio
    detect:
      width: 864
      height: 976
      fps: 5
    motion:
      threshold: 30
      # A fixed indoor mount on a litter floor. Detection drives review items;
      # motion only gates them.
    objects:
      track:
        # Deliberately minimal. A dense flock of a hundred birds is not a set of
        # countable objects to this detector — occlusion merges them into blobs,
        # and per-bird inference on CPU is expensive for no gain. Continuous
        # recording is the pipeline; object tracking is for the rare human.
        #
        # `bird` and `vehicle` are checked against the model labelmap rather
        # than assumed: `vehicle` is not a COCO label at all and Frigate drops
        # it with only a warning, leaving the feature silently absent.
        - person
