# Frigate NVR — local recording only, no cloud archive.
#
#   camera --RTSP--> frigate --local disk (rolling window)
#
#   docker compose up -d
#   docker compose logs -f frigate

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    # VAAPI needs a real /dev/dri, and ffmpeg needs shared memory to work.
    # No group_add: the container runs as root, which can already open
    # /dev/dri. Naming `render`/`video` here also fails on hosts whose daemon
    # cannot resolve them, and their GIDs are host-specific.
    shm_size: 2gb
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "5000:5000"   # web UI
      - "8554:8554"   # restreamed RTSP
    environment:
      # Consumed by the {FRIGATE_*} substitutions in frigate/config.yml
      FRIGATE_CAM_MAIN_URL: ${FRIGATE_CAM_MAIN_URL}
      FRIGATE_CAM_SUB_URL: ${FRIGATE_CAM_SUB_URL}
      FRIGATE_RETAIN_DAYS: ${FRIGATE_RETAIN_DAYS:-14}
      FRIGATE_SNAPSHOT_DAYS: ${FRIGATE_SNAPSHOT_DAYS:-14}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - ./frigate/config.yml:/config/config.yml:ro
      # Set FRIGATE_MEDIA_PATH in .env to point at a large disk on the host.
      # Kept relative by default so Docker never has to create a root-owned
      # directory at an absolute path it does not own.
      - ${FRIGATE_MEDIA_PATH:-./media}:/media/frigate
    env_file:
      - .env
